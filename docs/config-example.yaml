# yaml-language-server: $schema=https://raw.githubusercontent.com/janosmiko/lfk/main/docs/config.schema.json
# lfk - Full Configuration Example
# Place this file at ~/.config/lfk/config.yaml
# All fields are optional — only specify what you want to override.
#
# The modeline above enables autocompletion and validation in editors running
# a YAML language server. See docs/config-reference.md for the full reference.

# ─── Appearance ──────────────────────────────────────────────────────────────
# Visual settings, grouped. The flat keys of the same name below (colorscheme,
# icons, no_color, transparent_background, min_contrast_ratio, dim_overlay) are
# deprecated aliases; appearance wins when both are set. The `theme` block
# (custom color overrides) stays top-level.
appearance:
  colorscheme: tokyonight-storm
  icons: auto
  # no_color: false
  # transparent_background: false
  # min_contrast_ratio: 0.0
  # dim_overlay: true
  # Emphasize failed/progressing rows as a fallback when the Status cell isn't
  # visible: foreground (default) colors the Name cell when the Status column is
  # hidden, background adds a muted status-colored row background, off disables.
  # row_status_tint: foreground

# ─── Color Scheme ──────────────────────────────────────────────────────────────
# Built-in color scheme. 460+ themes are available (generated from ghostty themes).
# Press T in-app to browse and preview all themes interactively.
# Popular options: tokyonight-storm (default), dracula, nord, catppuccin-mocha,
#   rose-pine, gruvbox-dark, everforest-dark, one-half-dark, ayu-dark, nightfox
# Deprecated flat alias — prefer appearance.colorscheme above.
# colorscheme: tokyonight-storm

# ─── Auto Dark/Light Mode ─────────────────────────────────────────────────────
# Use Ghostty-style "dark:X,light:Y" syntax in the colorscheme field to enable
# automatic switching based on the OS appearance reported by the terminal
# (CSI 996/2031 protocol). Supported terminals: Ghostty, kitty >= 0.27,
# Contour, WezTerm (recent nightlies). Other terminals silently ignore the
# sequences.
#
# On startup lfk sends CSI ?2031h (subscribe) + CSI ?996n (query current pref).
# The terminal responds with dark (CSI ?997;1n) or light (CSI ?997;2n).
# Any later OS appearance change triggers a real-time switch.
#
# Either side may be omitted; segment order does not matter; spaces in scheme
# names are normalised to hyphens automatically.
#
# colorscheme: "dark:catppuccin-mocha,light:catppuccin-latte"
# colorscheme: "dark:Rose Pine,light:Rose Pine Dawn"

# ─── Transparent Background ───────────────────────────────────────────────────
# Use the terminal's own background instead of the theme's background colors
# for title bar and status bar. Selection highlights remain opaque.
# Default: false
# transparent_background: false

# ─── Icon Mode ─────────────────────────────────────────────────────────────────
# Icon display mode.
#   "auto"     - default; detects Nerd Font-capable terminals (Ghostty, Kitty,
#                WezTerm) and picks "nerdfont"; otherwise picks "unicode".
#   "unicode"  - curated unicode glyphs (works in any terminal).
#   "nerdfont" - Material Design Icons from Nerd Fonts v3.x (requires a Nerd
#                Font in your terminal).
#   "simple"   - ASCII labels like [Po], [De] (works in any terminal).
#   "emoji"    - emoji glyphs.
#   "none"     - no icons.
# The LFK_ICONS environment variable takes priority over this setting.
# Deprecated flat alias — prefer appearance.icons above.
# icons: auto

# ─── Mouse ────────────────────────────────────────────────────────────────────
# Capture mouse input for click navigation, scroll, and tab switching.
# Set to false to disable mouse capture, allowing native terminal text selection
# (shift+click, drag-to-select). Useful for macOS Terminal.app where shift+click
# does not work with mouse capture enabled.
# Also available as --no-mouse CLI flag.
# Default: true
# mouse: true

# ─── No Color ─────────────────────────────────────────────────────────────────
# Disable foreground and background colors throughout the UI. Emphasis is
# preserved via bold, underline, and reverse-video SGR attributes so the
# current selection remains visible in monochrome terminals.
# The NO_COLOR environment variable (https://no-color.org) takes precedence
# over this field — set NO_COLOR to any non-empty value to force monochrome
# without editing the config. Also available as --no-color CLI flag.
# Default: false
# no_color: false

# ─── Read-Only Mode ────────────────────────────────────────────────────────────
# Globally disable all mutating actions (delete, edit, scale, restart, exec,
# port-forward, drain, cordon, etc.). Useful as a safety default for shared
# kubeconfigs or audit-mode browsing of production clusters.
# Per-context overrides under clusters.<name>.read_only beat this field; the
# --read-only CLI flag wins over both.
# In-app: Ctrl+R toggles read-only — at the cluster picker it flips the
# highlighted row's [RO] marker (session-scoped, wins over config); inside
# a context it locks/unlocks the current tab.
# Default: false
# read_only: false

# ─── Field manager ─────────────────────────────────────────────────────────────
# Name lfk sends as the field manager on every write. The API server stores it
# in metadata.managedFields, which the YAML blame view (m) reads, so a change
# shows who made it instead of only naming the tool.
# Set a plain "lfk" to keep your username off the cluster.
# Cut to 128 characters, the API limit.
# Default: lfk:<os-user>
# field_manager: lfk

# ─── Show rarely-used resource types ───────────────────────────────────────────
# Surface the rarely-used resource types (CSI internals, admission webhooks,
# leases, runtime classes, and the "Advanced" category of uncategorized core
# resources) in the sidebar from startup — as if the H key were already pressed
# — so the full resource-type list is always visible.
# In-app: H toggles this for the session; it resets to this value on the next
# launch. Default: false
# show_rare_types: true

# ─── Security Dashboard ────────────────────────────────────────────────────────
# Built-in security findings dashboard (Security sidebar category + SEC badge).
# Sources auto-detect by their operator/CRDs: heuristic, advisor, and rbac (always
# on), trivy, kyverno, kubescape, falco, gatekeeper. See docs/security.md.
# Per-context overrides under clusters.<name>.security beat these globals.
# Default: enabled, all sources on.
# security:
#   enabled: true            # set false to turn the dashboard + probing off
#   hide_badges: false       # true hides the per-row SEC badge by default (toggle with B)
#   sources:
#     falco: false           # disable a single source; omitted = enabled
#     trivy: false
#   # Declarative, glob-based ignore rules (applied at load). Each field is a
#   # glob (* and ?); an empty field matches anything; a finding is hidden when
#   # every non-empty field matches. Read-only — the `i` toggle still reveals
#   # them. Interactive per-finding ignores (action menu `x`) are stored
#   # separately in ~/.local/state/lfk/security_ignores.yaml.
#   ignore_patterns:
#     - source: trivy-operator   # source id; "" = any
#       group: "CVE-2024-*"      # CVE id / check label / rule name; "" = any
#       namespace: kube-system   # "" or "*" = any namespace (hides whole group)
#       cluster: "prod-*"        # kube-context glob; "" = any cluster
#       comment: accepted in system namespaces
#     # Label match: exclude infrastructure pods (CNI/CSI) by label. Each entry
#     # is a label key -> glob value; ALL must match. Resource-scoped (hides
#     # matching pods, not the whole group); matches pods the heuristic source
#     # observed and same-pod findings.
#     - labels:
#         k8s-app: cilium        # silence all findings on Cilium pods
#       comment: CNI managed separately
#     - labels:
#         app.kubernetes.io/name: "longhorn-*"
#       comment: Longhorn storage pods
#   # Tune the built-in heuristic source. secret_env_include/_exclude are
#   # env-var name globs (* and ?, case-insensitive) for the secret_env check:
#   # include adds names to flag on top of the built-in credential keywords;
#   # exclude is never flagged and wins over include.
#   heuristic:
#     secret_env_include:
#       - "*_CONN_STR"           # also flag literal connection strings
#     secret_env_exclude:
#       - "MYAPP_FAKE_TOKEN"     # known non-secret; don't flag
#     scan_secrets: false        # forbid the source from listing Secrets
#                                # (disables legacy-token + TLS-expiry checks
#                                # and Secret-reference verification)

# ─── Log Path ──────────────────────────────────────────────────────────────────
# Application log file location (lfk's own debug log, NOT the log viewer).
# For log viewer settings, see the "Log Viewer" section below.
# Default: ~/.local/share/lfk/lfk.log
log_path: /tmp/lfk.log

# ─── Kubeconfig Directory ──────────────────────────────────────────────────────
# Directory (or list of directories) recursively scanned for kubeconfig files,
# in addition to ~/.kube/config. When the KUBECONFIG env var is set it is
# exclusive (like kubectl): the default ~/.kube/config and config.d scan are
# skipped, but explicit dirs below still merge. Tilde (~/) is expanded against
# $HOME. Override at runtime with --kubeconfig-dir (repeatable) or
# KUBECONFIG_DIR (colon-separated). --kubeconfig bypasses directory discovery.
# Default: ~/.kube/config.d
#
# Single value:
# kubeconfig_dir: ~/.kube/config.d
#
# Multiple directories — every kubeconfig under each one is merged:
# kubeconfig_dir:
#   - /team-a/configs
#   - /team-b/configs

# When KUBECONFIG is set, lfk loads only the files it lists (kubectl
# semantics) and skips ~/.kube/config plus the default ~/.kube/config.d
# scan. Set to false to merge everything like releases before 0.15.
# Overridden by --kubeconfig-exclusive and LFK_KUBECONFIG_EXCLUSIVE.
# kubeconfig_exclusive: true

# Default Log Top parser profile (auto-detect when "auto").
# Valid: auto, traefik-json, ingress-nginx, nginx-combined, envoy, json, logfmt.
# log_top_default_profile: auto

# ─── Log Viewer ──────────────────────────────────────────────────────────────
# Settings for the log viewer (L key). The show_* defaults let you skip pressing
# the toggle keys on every open. Runtime toggles (configurable keybindings):
# toggle_preview (P), toggle_prefixes (p), toggle_timestamps (s).
# tail_lines / tail_lines_short / render_ansi were previously the
# flat log_tail_lines / log_tail_lines_short / log_render_ansi keys (still
# accepted as deprecated aliases; log_viewer wins when both are set).
# log_viewer:
#   tail_lines: 100         # lines loaded initially via --tail (per container) (older history loads on scroll-up)
#   tail_lines_short: 10    # lines loaded by the "Tail Logs" action; non-positive ignored
#   render_ansi: true       # render ANSI colour/bold/underline; false strips them (:set ansi/noansi)
#   show_preview: true      # structured preview side panel shown on open
#   show_prefixes: true     # [pod/name/container] line prefixes shown on open
#   show_timestamps: false  # log line timestamps hidden on open
#   preview_live: false     # right-pane live-log preview on explorer open (L to toggle)
#   max_lines: 50000        # max retained log lines per tab (oldest dropped); clamped [1000, 1000000]
#   wrap: false             # log lines wrapped on open (toggle: >)

# ─── Viewer Defaults ─────────────────────────────────────────────────────────
# Startup defaults for the fullscreen YAML / diff / describe viewers. A toggle
# changed at runtime resets to the configured default the next time the viewer
# opens. Runtime toggles (configurable keybindings): toggle_wrap (>) wraps in
# every viewer; toggle_line_numbers (#) and toggle_unified (u) for the diff viewer.
# yaml_viewer:
#   wrap: false
# diff_viewer:
#   wrap: false
#   line_numbers: true
#   unified: false
# describe_viewer:
#   wrap: false
# object_explorer:
#   live: true   # live-refresh the browsed object under watch mode (toggle: w)
#   tree: false  # open in the ASCII-art tree view (toggle: T)
# api_explorer:
#   tree: false  # open in the ASCII-art tree view (toggle: T)

# ─── Session Defaults ────────────────────────────────────────────────────────
# Startup state for the main view. split_preview toggles the preview pane,
# watch_mode toggles live polling, all_namespaces sets the namespace scope
# (unset, a pinned kubeconfig namespace wins). CLI/session scope overrides it.
# split_preview: true
# watch_mode: true
# all_namespaces: true

# ─── Events ──────────────────────────────────────────────────────────────────
# Startup defaults for the events view.
# events:
#   warnings_only: true  # show Warning events only on open
#   grouping: true       # group related events by reason on open

# ─── Dashboard ─────────────────────────────────────────────────────────────────
# Show cluster overview dashboard when entering a context.
# Set to false to go directly to the resource types list.
dashboard: true

# ─── Monitoring Endpoints ──────────────────────────────────────────────────────
# Configure Prometheus and Alertmanager endpoints per cluster context.
# Keys are kubeconfig context names; the special key "_global" applies to
# clusters without an explicit entry.
# When not configured, lfk auto-discovers monitoring services by trying
# common service names across common namespaces.
monitoring:
# my-prod-cluster:
#   prometheus:
#     namespaces: ["monitoring"]
#     services: ["thanos-query"]
#     port: "9090"
#   alertmanager:
#     namespaces: ["monitoring"]
#     services: ["alertmanager-main"]
#     port: "9093"
#   node_metrics: prometheus  # "prometheus" or "metrics-api" (default: auto-detect)
#                             # "prometheus" also enables the nodes-list Uptime
#                             # column, which needs node_exporter installed.
# _global:
#   prometheus:
#     namespaces: ["monitoring", "observability"]
#     services: ["prometheus-server", "prometheus"]

# ─── Right-sizing Advisor Defaults ─────────────────────────────────────────────
# Initial strategy + headroom that the Right-sizing overlay opens with on the
# first overlay open of a session. Once the user changes either value via the
# overlay's [/] / </> pickers, those choices stick across subsequent overlay
# opens within the session — so these config keys only seed the "cold start"
# state. Restarting lfk wipes the sticky state and the config defaults take
# over again on the next first open.
#
# Both fields optional:
#   strategy: vpa | prom_max_1d | prom_avg_1d | prom_p95_7d | snapshot
#   headroom: 1.0 | 1.1 | 1.25 | 1.5 | 1.75 | 2.0
#
# Invalid values are dropped at startup with a warning in the lfk error log.
# A configured strategy that's unavailable for a specific workload (e.g. vpa
# with no matching VPA, or prom_* with no Prometheus configured) falls back to
# the workload's first available strategy on a per-overlay-open basis.
# rightsizing_defaults:
#   strategy: vpa
#   headroom: 1.25

# ─── Views (columns + sort per resource type) ──────────────────────────────────
# Configure visible columns and default sort for specific resource types.
# Keys are GVR ("apps/v1/deployments") or Kind name ("deployment", case-insensitive).
# GVR wins when both match the same resource.
#
# Column spec: NAME[:.jsonpath][|flag]*
#   NAME alone    → built-in column (Name, Age, Ready, REV, CPU, MEM, …)
#   NAME:.path    → custom column; JSONPath evaluated against the source object
#                   (k8s.io/client-go/util/jsonpath — kubectl-flavored dialect)
#   Flags (stackable): R=right-align, T=humanize-timestamp, W=wide-only
#
# sort_column: "COL" or "COL:asc" / "COL:desc"
#   Direction omitted: REV defaults to desc, all other columns default to asc.
#
# JSONPath compile errors skip that view with a warning; misses at row render
# produce an empty cell.
# views:
#   # GVR key — resolves before matching Kind key for the same resource
#   apps/v1/deployments:
#     columns: ["Name", "Namespace", "Replicas", "Available", "REV", "Age"]
#     sort_column: "REV"        # desc by default for REV
#   # Kind key (case-insensitive)
#   pod:
#     columns:
#       - "Name"
#       - "IP"
#       - "Node"
#       - "GitSHA:.metadata.labels.git-sha|W"   # custom column, wide-only
#       - "Age"
#     sort_column: "Age:asc"

# ─── Per-Resource-Type Columns (deprecated) ────────────────────────────────────
# Deprecated: use views above. Existing entries are bridged automatically as views
# without sort_column. views wins for any Kind where both are configured.
resource_columns:
# Pod: ["IP", "Node", "Image", "CPU", "MEM", "CPU/R", "CPU/L", "MEM/R", "MEM/L"]
# Deployment: ["Replicas", "Available", "CPU", "MEM"]
# Service: ["*"]  # show all for Services
# StatefulSet: ["Replicas"]

# ─── Scheduler & API Client Rate Limits ────────────────────────────────────────
# Client-side QPS/burst for API calls. Default 50/100 (client-go's stock 5/10 is
# too low for a multi-resource TUI). Override globally here, or per cluster below.
# Background-work scheduling keeps metrics / events / security scans / dashboards
# progressing under continuous foreground load on slow clusters:
#   workers_per_context  - concurrent workers per cluster (default 8, max 16)
#   low_reserved_slots   - workers that prefer background work (default 2)
#   aging_threshold      - promote a starved background task after N higher-prio
#                          dispatches (default 8; 0 = strict priority)
# scheduler:
#   k8s_client_qps: 50
#   k8s_client_burst: 100
#   workers_per_context: 8
#   low_reserved_slots: 2
#   aging_threshold: 8

# ─── Per-Cluster Overrides ─────────────────────────────────────────────────────
# Override settings per kubeconfig context name.
# Supports per-cluster views, resource_columns (deprecated), read_only, security,
# and k8s_client_qps / k8s_client_burst.
# Per-cluster overrides take precedence over the matching global setting.
clusters:
# my-prod-cluster:
#   read_only: true                       # lock production against mutations
#   k8s_client_qps: 200                   # raise the rate ceiling on a big cluster
#   k8s_client_burst: 400
#   security:
#     enabled: false                      # turn the security dashboard off here
#     hide_badges: true                   # or keep it on but hide the per-row SEC badge here
#   views:
#     apps/v1/deployments:
#       columns: ["Name", "Replicas", "Available", "REV", "Age"]
#       sort_column: "REV"
#     pod:
#       columns: ["Name", "IP", "Node", "Image", "CPU", "MEM"]
# my-staging-cluster:
#   security:
#     sources:
#       falco: false                      # keep the dashboard, drop Falco here
#   views:
#     pod:
#       columns: ["Name", "IP", "Node", "Image"]

# ─── Theme ─────────────────────────────────────────────────────────────────────
# Custom color theme. All values are CSS hex color codes.
# Only specify colors you want to override; others keep colorscheme defaults.
theme:
  primary: "#7aa2f7" # Borders, headers, breadcrumbs, active columns
  secondary: "#9ece6a" # Help keys, running status, success markers
  text: "#c0caf5" # Normal text
  selected_fg: "#1a1b26" # Selected item foreground
  selected_bg: "#7aa2f7" # Selected item background
  border: "#3b4261" # Inactive borders
  dimmed: "#565f89" # Help text, placeholders, dimmed items
  error: "#f7768e" # Errors, failures, delete confirmations
  warning: "#e0af68" # Warnings, pending status, namespace indicator
  purple: "#bb9af7" # Special values
  base: "#1a1b26" # Dark background base
  bar_bg: "#24283b" # Title and status bar backgrounds
  surface: "#1f2335" # Surface color for overlays

# ─── Keybindings ───────────────────────────────────────────────────────────────
# Override direct-action keybindings. Navigation and other keys are fixed.
keybindings:
  logs: "ctrl+l" # Open fullscreen log viewer (default: ctrl+l)
  toggle_preview_logs: "L" # Toggle right-pane live-log preview (default: L)
  refresh: "R" # Refresh view (default: R)
  describe: "v" # Describe resource (default: v)
  delete: "D" # Delete resource (default: D)
  force_delete: "X" # Force delete resource (default: X)
  scale: "S" # Scale resource (default: S)
  toggle_wrap: ">" # Toggle line wrapping in YAML/diff/describe/log/event viewers (default: >)
  toggle_line_numbers: "#" # Toggle line numbers in diff/log viewers (default: #)
  toggle_fold: "z" # Toggle fold under cursor in YAML/diff viewers (default: z)
  toggle_fold_all: "Z" # Toggle all folds in YAML/diff viewers (default: Z)
  toggle_follow: "F" # Toggle follow/auto-scroll in the log viewer (default: F; f now opens the log filter)
  severity_up: "o" # Raise the minimum log severity shown in the log viewer (default: o)
  severity_down: "i" # Lower the minimum log severity shown in the log viewer (default: i)
  toggle_timestamps: "s" # Toggle timestamps in the log viewer (default: s)
  toggle_prefixes: "p" # Toggle pod/container line prefixes in the log viewer (default: p)
  toggle_unified: "u" # Toggle unified vs side-by-side in the diff viewer (default: u)
  tree_view: "T" # Toggle the ASCII-art tree view in the Object/API Explorers (default: T)
  field_doc: "ctrl+k" # Toggle the schema side pane for the field under the cursor in the YAML viewer and Object Explorer (default: ctrl+k)
  mouse_toggle: "ctrl+alt+y" # Suspend/resume mouse capture for native text selection (Ctrl+Option+Y; default: ctrl+alt+y)
  cluster_color_picker: "L" # Open cluster-color picker (default: Shift+L; shares "L" with toggle_preview_logs, gated by level — at the cluster picker "L" opens this, at deeper levels it toggles the live-log preview)
  security_ignore_toggle: "i" # Show/hide ignored security findings (default: i; security view only — shadows the Label Editor there)
  session_manager: "C" # Open the session manager overlay: save/switch/delete named workspace sessions (default: C)
  security_badge_toggle: "B" # Show/hide the per-resource SEC severity badge (default: B)
  move_tab_left: "{" # Move the current tab one slot left (default: { = shift+[)
  move_tab_right: "}" # Move the current tab one slot right (default: } = shift+])
  which_key_leader: "?" # Open the which-key action panel (default: ?; explorer and the fullscreen viewers, not exec mode or overlays; F1 opens help there)
  select_range: "ctrl+space" # Select range from anchor to cursor (default: ctrl+space; legacy "ctrl+@" still accepted)
  previous_namespace: "g\\" # Jump to previous namespace, swapping the scope back and forth (default: g\)

# ─── Search Abbreviations ─────────────────────────────────────────────────────
# Short names for resource types used in search/filter.
# These extend the built-in defaults. Override a built-in by redefining the key.
abbreviations:
  po: pod
  dp: deployment
  dep: deployment
  deploy: deployment
  rs: replicaset
  sts: statefulset
  ds: daemonset
  svc: service
  ing: ingress
  cm: configmap
  sec: secret
  ns: namespace
  no: node
  pvc: persistentvolumeclaim
  pv: persistentvolume
  sc: storageclass
  sa: serviceaccount
  hpa: horizontalpodautoscaler
  vpa: verticalpodautoscaler
  cj: cronjob
  job: job
  crd: customresourcedefinition
  ev: event
  ep: endpoint
  eps: endpointslice
  rb: rolebinding
  crb: clusterrolebinding
  cr: clusterrole
  role: role
  limit: limitrange
  quota: resourcequota
  pdb: poddisruptionbudget
  netpol: networkpolicy
  rc: replicationcontroller
  # Add your own custom abbreviations:
  # myapp: myapplication.example.com

# ─── Custom Actions ────────────────────────────────────────────────────────────
# Define custom shell commands per resource type.
# These appear in the action menu (x key) after the built-in actions.
#
# Template variables:
#   {name}       - Resource name
#   {namespace}  - Resource namespace
#   {context}    - Kubeconfig context name
#   {kind}       - Resource kind (e.g., "Pod")
#   {<Column>}   - Any column value (e.g., {Node}, {IP}) — case-insensitive
#
# Commands are executed via `sh -c` with KUBECONFIG set.
# Interactive commands (ssh, etc.) hand over the terminal.
#
# Set read_only_safe: true on actions that don't change cluster state so
# they remain available in read-only mode. Without this flag custom
# actions are treated as mutating (defensive default) and blocked when
# read-only is active.
custom_actions:
# Pod:
#   - label: "SSH to Node"
#     command: "ssh {Node}"
#     key: "S"
#     description: "SSH into the pod's node"
#     # No read_only_safe -> blocked in read-only mode (SSH could mutate).
#   - label: "Copy Logs"
#     command: "kubectl logs {name} -n {namespace} --context {context} > /tmp/{name}.log"
#     key: "C"
#     description: "Copy pod logs to file"
#     read_only_safe: true   # logs only, safe in read-only mode
#   - label: "Tcpdump"
#     command: "kubectl exec -it {name} -n {namespace} --context {context} -- tcpdump -i any -w /tmp/capture.pcap"
#     key: "T"
#     description: "Capture network traffic"
# Deployment:
#   - label: "Rollout History"
#     command: "kubectl rollout history deployment/{name} -n {namespace} --context {context}"
#     key: "H"
#     description: "Show deployment rollout history"
#     read_only_safe: true   # rollout history is read-only
# Service:
#   - label: "Curl Endpoint"
#     command: "kubectl run curl-test --rm -it --image=curlimages/curl --restart=Never -n {namespace} --context {context} -- curl -s http://{name}"
#     key: "C"
#     description: "Curl the service endpoint"

# ─── Filter Presets ───────────────────────────────────────────────────────────
# Define custom quick filter presets per resource type.
# These appear alongside the built-in presets when you press "." at resource level.
#
# Each preset has:
#   name  - Display name in the filter overlay
#   key   - Single-character shortcut key (must not conflict with built-in presets)
#   match - Filter criteria (all specified fields must match — AND logic):
#     status:       Substring match against the resource status (case-insensitive)
#     ready_not:    true to match resources where ready count != desired (e.g., "1/3")
#     restarts_gt:  Match pods with restart count greater than this number
#     column:       Column key to check (case-insensitive, e.g., "Node", "IP")
#     column_value: Substring match against the column value (case-insensitive)
#     invert:       true to negate the entire match (e.g., status=Bound + invert
#                   matches anything that is NOT Bound)
#
# Built-in presets vary by kind. Pod: Failing/Pending/Not Ready/Restarting/
# High Restarts/Not Running. Deployment/StatefulSet/DaemonSet: Not Ready/
# Failing/Not Running. Job: Failed/Not Running. PV: Available/Released/Failed/
# Not Bound. PVC: Pending/Lost/Not Bound.
# Universal presets (Old, Recent) are always shown. Your custom presets appear
# after the built-ins.
filter_presets:
# Pod:
#   - name: "On GPU Nodes"
#     key: "g"
#     match:
#       column: "Node"
#       column_value: "gpu"
#   - name: "High Memory"
#     key: "m"
#     match:
#       column: "MEM"
#       column_value: "Gi"
# Deployment:
#   - name: "Single Replica"
#     key: "1"
#     match:
#       column: "Replicas"
#       column_value: "1"
# Event:
#   - name: "OOM Events"
#     key: "m"
#     match:
#       status: "OOMKilled"

# ─── Extra Goto Chords ──────────────────────────────────────────────────────
# Extra goto chords (g prefix), including CRDs. Key is the full chord; must
# start with jump_top plus one keypress ("gA", "gctrl+p").
# goto_targets:
#   ga: { kind: Application, group: argoproj.io, name: ArgoCD Applications }
#   gA: { kind: ApplicationSet, group: argoproj.io, name: AppSets }
#   gx: { kind: Rollout, group: argoproj.io }

# ─── Which-Key Popup ─────────────────────────────────────────────────────────
# which_key_enabled: true
# which_key_delay_ms: 0

# Delay before the which-key action panel (leader "?") appears (ms, 0-2000).
# which_key_leader_delay_ms: 0

# Startup order of the action panel: true groups by category, false sorts by
# key. The leader key toggles it and saves the choice to
# ~/.local/state/lfk/whichkey_prefs.yaml, which then outranks this setting.
# which_key_grouped: true

# ─── Pinned CRD Groups ──────────────────────────────────────────────────────
# Pin CRD API groups so they appear right after built-in categories
# (Workloads, Networking, etc.) instead of being sorted alphabetically.
# Can also be managed interactively: press 'p' at resource types level.
# In-app pins are stored per-context or per named union set in
# ~/.local/state/lfk/pinned.yaml.
# Pin individual resource types (version-agnostic group/resource) into a
# top-level "Pinned" section, below the dashboards. Works for built-in and
# CRD types. Manage interactively with 'p' at the resource types level
# (stored per-context or per named union set in ~/.local/state/lfk/pinned.yaml).
# pinned_types:
#   - apps/deployments
#   - argoproj.io/applications
#   - /pods
#
# Show selected resource types' status summaries (the same bars the preview
# band shows) as inline rows on the cluster dashboard. Keys are
# version-agnostic group/resource. Manage interactively from the action menu
# ('x') at the resource types level (stored per-context or per named union
# set in ~/.local/state/lfk/pinned_summaries.yaml). Max 10 per scope.
# Unset shows built-in defaults (Jobs, Deployments, Argo Applications, Flux
# Kustomizations, cert-manager Certificates); set to [] to disable them.
# pinned_summaries:
#   - batch/jobs
#   - argoproj.io/applications
#   - /pods
#
# Legacy: pin whole CRD API groups. Still honored and expanded into member
# types on load, but pinning individual types above is preferred.
# pinned_groups:
#   - karpenter.sh
#   - monitoring.coreos.com
#   - argoproj.io
#   - longhorn.io

# ─── Startup Tips ─────────────────────────────────────────────────────────────
# Show a random tip in the status bar on startup.
# Set to false to disable.
tips: true

# ─── Confirm on Exit ─────────────────────────────────────────────────────────
# Show quit confirmation when pressing ctrl+c on the last tab.
# Set to false to exit immediately on ctrl+c.
confirm_on_exit: true

# ─── Delete Propagation Policy ───────────────────────────────────────────────
# Cascade policy the delete confirm dialog starts on. Tab cycles it per delete.
#   background - delete now, garbage collector removes dependents (default)
#   foreground - keep the object until every dependent is gone
#   orphan     - leave dependents running
#   none       - send no policy; the API server applies its own default
#                (Orphan for Jobs and ReplicationControllers)
# delete_propagation_policy: background

# ─── Dim Overlay ─────────────────────────────────────────────────────────────
# Fade the rest of the screen while any overlay is up. Enabled by default;
# uncomment to opt out (e.g. for terminals where SGR faint looks awkward).
# dim_overlay: false

# ─── Terminal Mode ────────────────────────────────────────────────────────────
# How exec and shell commands are executed.
# "pty" (default): Embedded in the TUI — host shift+drag selects text
# "exec": Takes over the terminal (lfk suspends until the shell exits)
# "mux": Opens in a new tmux/zellij window or pane (requires lfk to be running
#        inside a supported multiplexer; lfk stays foregrounded alongside it)
# Cycle at runtime with Ctrl+T (mux is skipped when no multiplexer is detected).
# terminal: pty

# ─── PTY Scrollback ───────────────────────────────────────────────────────────
# Per-tab capacity of the embedded PTY scrollback ring (in lines). Only
# affects pty mode; exec and mux delegate scrollback to the host terminal.
# Clamped to [100, 100000]. Default 5000 covers an extended interactive
# session without bloating memory. Use Ctrl+] Ctrl+U/Ctrl+D (half page),
# Ctrl+] Ctrl+B/Ctrl+F (full page), Ctrl+] g/G (oldest/live), or the
# mouse wheel (1 line per tick) to navigate.
# scrollback_lines: 5000

# ─── Watch Interval ───────────────────────────────────────────────────────────
# Polling interval used when watch mode is active (press 'w' to toggle).
# Accepts any Go duration string: "500ms", "2s", "5s", "1m".
# Clamped to [500ms, 10m] — values outside the range are pinned to the bounds.
# Invalid values fall back to the default (2s).
# Override with the --watch-interval CLI flag.
# Default: 2s
# watch_interval: 2s

# ─── Background / Idle Watch Interval ───────────────────────────────────────
# Watch cadence while the lfk window is unfocused or a focused window has been
# idle for foreground_idle_timeout. Slows background wakeups to save battery;
# snaps back to watch_interval on focus or keypress. Same form and [500ms, 10m]
# clamp as watch_interval. Set equal to watch_interval to disable background throttling.
# Default: 10s
# background_watch_interval: 10s

# ─── Foreground Idle Timeout ──────────────────────────────────────────────────
# After this much time with no keypress, a focused window throttles its watch
# tick to background_watch_interval. Set to 0s to disable focused-idle throttling
# (background throttling still applies). Default: 120s
# foreground_idle_timeout: 120s

# ─── Metrics Interval ─────────────────────────────────────────────────────────
# Minimum gap between two list-wide CPU/MEM fetches on a watch-tick refresh.
# metrics-server recomputes every 15s or so. Clamped to [2s, 10m]. Set to 0s to
# fetch on every tick. A manual refresh always fetches. Default: 15s
# metrics_interval: 15s

# ─── Watch Throttle ───────────────────────────────────────────────────────────
# Master switch for the focus/idle throttling above. Set to false to disable it
# entirely: the watch tick always uses watch_interval regardless of focus or
# idle state. Default: true
# watch_throttle: true

# ─── Kubeshark ────────────────────────────────────────────────────────────────
# Namespace probed for Service kubeshark-hub by the Traffic Capture overlay.
# Default: kubeshark (matches `helm install kubeshark/kubeshark -n kubeshark`).
# kubeshark:
#   namespace: kubeshark

# ─── Informer Cache ───────────────────────────────────────────────────────────
# How resource list calls are routed:
#   "off"     - round-trip every list to the API server (matches kubectl).
#   "auto"    - default. Per resource type, start in direct-list mode and
#               promote to a shared informer once a list returns >= 1000
#               items, or a repeated refresh keeps it hot regardless of
#               size. Events, Secrets, metrics, and non-watchable types
#               never promote. Demote below 500 or when refreshes stop.
#   "always"  - open a watch eagerly on first use of each resource type.
# Legacy bool form: true → "always", false → "off".
# Default: auto
# informer_cache: auto

# ─── Scrolloff ────────────────────────────────────────────────────────────────
# Lines to keep visible above/below the cursor when scrolling. Used by all
# views with cursor-based navigation.
# scrolloff: 5

# ─── Secret Lazy Loading ──────────────────────────────────────────────────────
# When true, Secret listing fetches metadata only; decoded values load on
# hover. Useful in clusters with many Helm release Secrets or large TLS
# payloads, at the cost of an extra GET per hovered Secret.
# secret_lazy_loading: false

# ─── Minimum Contrast Ratio ───────────────────────────────────────────────────
# Normalized [0.0, 1.0] knob. When > 0, foreground colors are nudged in HSL
# lightness space to meet a minimum WCAG contrast against their backgrounds.
# 0.175 ≈ WCAG AA (4.5:1); 0.3 ≈ WCAG AAA (7:1).
# min_contrast_ratio: 0.0
