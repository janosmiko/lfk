# Builds and publishes a GitHub release (with Homebrew formula) on version tags.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Runs first (no needs) so a mismatched flake.nix fails the pipeline
  # in seconds instead of waiting on build/test/lint/govulncheck.
  verify-flake-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify flake.nix version matches tag
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          TAG="${TAG_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          # Pre-release tags can carry a suffix (e.g. v1.2.3-rc.1); the flake
          # version is always the bare X.Y.Z, so strip everything after the dash.
          BASE_TAG="${TAG_VERSION%%-*}"
          FLAKE_VERSION=$(grep -E '^\s*baseVersion\s*=' flake.nix | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Tag:   $BASE_TAG"
          echo "Flake: $FLAKE_VERSION"
          if [ "$BASE_TAG" != "$FLAKE_VERSION" ]; then
            echo "::error::flake.nix baseVersion ($FLAKE_VERSION) does not match tag ($BASE_TAG)."
            echo "::error::Run 'make release VERSION=$BASE_TAG' (or 'make bump-version') on the commit you want to tag, commit the change, then re-tag."
            exit 1
          fi

  # Builds the Nix flake to confirm vendorHash matches the vendored module set.
  # If a release ships with a stale hash, `nix build` from a tag fails for users
  # (see issue #62). Catching that here is faster than fielding a bug report.
  verify-flake-build:
    needs: [verify-flake-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build flake
        id: build
        run: nix build .#default --no-link 2>&1 | tee build.log

      - name: Explain stale-hash failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          if grep -q "hash mismatch" build.log; then
            echo "::error::Nix flake vendorHash is stale. Run 'make refresh-vendor-hash' locally, commit flake.nix, then re-tag."
          fi

  build-and-test:
    needs: [verify-flake-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  lint:
    needs: [verify-flake-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.1

  govulncheck:
    needs: [verify-flake-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        run: govulncheck ./...

  release:
    needs: [build-and-test, lint, govulncheck, verify-flake-version, verify-flake-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # id-token is required for keyless cosign signing via Sigstore OIDC.
      id-token: write
      # attestations is required for actions/attest-build-provenance to publish
      # SLSA provenance attestations on the release artifacts.
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      # GoReleaser's chocolateys publisher invokes `choco pack` and `choco push`,
      # which require `choco` on PATH. On Linux runners we install mono +
      # the official chocolatey tarball + a tiny `mono` wrapper (the pattern
      # used by twpayne/chezmoi and golangci/golangci-lint). Mono is no longer
      # preinstalled on ubuntu-24.04, so we apt-install mono-devel here.
      # This avoids the workspace-bind-mounting docker action that left an
      # `opt/` directory in the checkout and dirtied git state.
      - name: Install Chocolatey CLI
        env:
          CHOCOLATEY_VERSION: 2.7.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mono-devel
          mkdir -p /opt/chocolatey
          wget -q -O - "https://github.com/chocolatey/choco/releases/download/${CHOCOLATEY_VERSION}/chocolatey.v${CHOCOLATEY_VERSION}.tar.gz" | tar -xz -C /opt/chocolatey
          # choco push is best-effort: when a release is still pending in the
          # Chocolatey moderation queue, `choco push` exits non-zero even though
          # the package was submitted. Wrap it so push failures warn but do not
          # fail the release. `pack` and other subcommands still fail normally.
          cat <<'WRAP' | sudo tee /usr/local/bin/choco > /dev/null
          #!/bin/bash
          if [ "$1" = "push" ]; then
            mono /opt/chocolatey/choco.exe "$@" || {
              echo "::warning::choco push failed (package may already be in the Chocolatey moderation queue); continuing."
              exit 0
            }
          else
            exec mono /opt/chocolatey/choco.exe "$@"
          fi
          WRAP
          sudo chmod +x /usr/local/bin/choco
          choco --version

      # GoReleaser's publishers: block invokes the `cloudsmith` CLI to push
      # .deb and .rpm artifacts to cloudsmith.io/janosmiko/lfk. We use
      # `pip install --user` (not pipx) because pipx on the GitHub-hosted
      # runner image resolved its bin dir relative to the workspace and
      # left an `opt/` directory in the checkout, which dirtied the
      # working tree and made GoReleaser refuse to run.
      - name: Install Cloudsmith CLI
        run: |
          python3 -m pip install --user --quiet cloudsmith-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cloudsmith" --version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Preflight: verify every required secret is present before GoReleaser
      # starts. Without this, a missing secret causes a confusing mid-publish
      # failure deep in GoReleaser's output.
      - name: Preflight - assert release secrets present
        env:
          RELEASE_TAP_TOKEN: ${{ secrets.RELEASE_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=()
          for s in RELEASE_TAP_TOKEN WINGET_TOKEN CHOCOLATEY_API_KEY CLOUDSMITH_API_KEY AUR_SSH_PRIVATE_KEY DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [ -z "${!s}" ]; then missing+=("$s"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets present."

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAP_TOKEN: ${{ secrets.RELEASE_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      # Generates SLSA build provenance attestations for every release artifact.
      # GitHub publishes the attestations alongside the release so downstream
      # tools (e.g. OpenSSF Scorecard, `gh attestation verify`) can prove the
      # artifacts were built from this repo at this commit.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.sbom.json
            dist/checksums.txt
